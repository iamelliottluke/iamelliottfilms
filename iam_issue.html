<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="IAM_ISSUE zine by Elliott Luke — a digital archive of identity, energy and creative style. Still evolving. Still experimenting.">
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IAM_ISSUE</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap&family=Impact&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    html, body {
      font-family: 'Playfair Display', serif;
      background: #000;
      scroll-snap-type: y mandatory;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: transparent;
      color: white;
      z-index: 10;
      font-family: Impact, sans-serif;
    }

    header h1, header a.button {
      font-size: 0.94rem;
      text-transform: uppercase;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }

    .parallax-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
    }

    section {
      min-height: 100vh;
      padding-top: 6rem;
      display: flex;
      justify-content: center;
      align-items: center;
      scroll-snap-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(30px);
      border-radius: 1rem;
      padding: 2rem;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 0 40px rgba(0,0,0,0.2);
      text-align: center;
    }

    .card h2 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .card p {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }

    .flipbook-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
    }

    .flipbook {
      display: flex;
      gap: 1rem;
      max-width: 700px;
      justify-content: center;
    }

    .flipbook img {
      width: 48%;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      object-fit: contain;
    }

    .arrow-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      opacity: 0.5;
      z-index: 2;
    }

    .arrow-btn svg {
      width: 30px;
      height: 30px;
      stroke: black;
    }

    .arrow-left {
      left: -40px;
    }

    .arrow-right {
      right: -40px;
    }

    .purchase-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .purchase-links a {
      padding: 0.6rem 1.2rem;
      border: 2px solid black;
      text-decoration: none;
      font-weight: bold;
      color: black;
    }

    @media (max-width: 768px) {
      .flipbook {
        flex-direction: column;
        align-items: center;
      }

      .flipbook img {
        width: 100%;
      }

      .arrow-btn {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="index.html" style="color:white; text-decoration:none;">iamelliottfilms</a></h1>
    <a class="button" href="iam_issue.html">IAM_ISSUE</a>
  </header>

  <video autoplay muted loop playsinline class="parallax-bg" id="parallaxVideo">
    <source src="SITE_BACKGROUND.mp4" type="video/mp4" />
  </video>

  <section>
    <div class="card">
      <h2>IAM_ISSUE</h2>
      <p>IAM_ISSUE — a photo zine series that puts regular people in the spotlight. No pro models, no big production — just real people... An evolving archive.</p>

      <div class="flipbook-container">
        <button class="arrow-btn arrow-left" onclick="flipPrev()">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>

        <div class="flipbook" id="flipbook"></div>

        <button class="arrow-btn arrow-right" onclick="flipNext()">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>

      <div class="purchase-links">
        <a href="#">Buy Digital Edition</a>
        <a href="#">Buy Physical Edition</a>
      </div>
    </div>
  </section>
