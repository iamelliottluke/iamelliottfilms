<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PHOTOS – IAMELLIOTTFILMS</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>

  <!-- Sticky Header -->
  <header>
    <h1><a href="index.html">IAMELLIOTTFILMS</a></h1>
    <nav class="nav-links">
      <a href="index.html">FILMS</a>
      <a href="iam_issue.html">PHOTOS</a>
    </nav>
  </header>

  <!-- Zine-specific Background -->
  <video id="background-video" autoplay muted loop playsinline preload="auto" poster="fallback.jpg">
    <source src="zine_teaser.mp4" type="video/mp4" />
  </video>

  <!-- Film grain overlay -->
  <div id="grain-overlay"></div>

  <!-- Zine Intro Section -->
  <section class="section centered-section">
    <h2 class="title">IAM_ISSUE</h2>
    <p class="description">
      A photo zine series that puts regular people in the spotlight. No pro models, no big production... just real people.  
      <br><br><em>An evolving archive.</em>
    </p>
  </section>

  <!-- Zine Previews -->
  <section class="section centered-section">
    <div class="zine-preview-grid">
      <img src="joah1.jpg" alt="IAM_ISSUE Page 1" loading="lazy">
      <img src="joah2.jpg" alt="IAM_ISSUE Page 2" loading="lazy">
      <img src="joah3.jpg" alt="IAM_ISSUE Page 3" loading="lazy">
      <video autoplay muted loop playsinline preload="metadata">
        <source src="joah4.mp4" type="video/mp4" />
      </video>
    </div>
    <div style="margin-top: 2rem;">
      <a href="https://elliottfilms.gumroad.com/l/iamissue" class="social-links">BUY DIGITAL ZINE</a>
    </div>
  </section>

  <!-- Additional Photography Section -->
  <section class="section centered-section">
    <h2 class="title">OTHER PHOTOGRAPHY</h2>
    <p class="description">Portraiture, moments, and experiments captured through my lens.</p>
    <div class="zine-preview-grid">
      <img src="photo1.jpg" alt="Photo 1" loading="lazy">
      <img src="photo2.jpg" alt="Photo 2" loading="lazy">
      <img src="photo3.jpg" alt="Photo 3" loading="lazy">
      <img src="photo4.jpg" alt="Photo 4" loading="lazy">
    </div>
  </section>

</body>
</html>
