<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="IAM_ISSUE by Elliott Luke – a visual zine exploring personality, texture, and expression.">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IAM_ISSUE</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Impact&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    html, body {
      height: 100%;
      font-family: 'Playfair Display', serif;
      background-color: black;
      color: black;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      color: white;
      font-family: 'Impact', sans-serif;
      z-index: 10;
    }

    header h1, header a.button {
      font-size: 1rem;
      text-transform: uppercase;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    section {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4rem 1rem;
      scroll-snap-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(40px);
      border-radius: 1rem;
      padding: 3rem 2rem;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .card h2 {
      font-family: 'Impact', sans-serif;
      font-size: clamp(2rem, 8vw, 5rem);
      margin-bottom: 1rem;
    }

    .card p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    iframe {
      width: 100%;
      height: 400px;
      border: none;
      margin-bottom: 1.5rem;
      border-radius: 10px;
    }

    .purchase-links a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border: 2px solid black;
      color: black;
      text-decoration: none;
      margin: 0.5rem;
      font-weight: bold;
      transition: background 0.3s;
    }

    .purchase-links a:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input, textarea {
      padding: 0.75rem;
      border: none;
      border-bottom: 2px solid black;
      background: transparent;
      font-size: 1rem;
    }

    input[type="submit"] {
      border: 2px solid black;
      background: transparent;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    input[type="submit"]:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 600px) {
      .card {
        padding: 2rem 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="index.html" style="color:white; text-decoration:none;">iamelliottfilms</a></h1>
    <a class="button" href="iam_issue.html">IAM_ISSUE</a>
  </header>

  <video autoplay muted loop class="video-bg">
    <source src="SITE_BACKGROUND.mp4" type="video/mp4">
    Your browser does not support video playback.
  </video>

  <section>
    <div class="card">
      <h2>IAM_ISSUE</h2>
      <p>A visual zine by Elliott Luke, exploring personality, style, texture, and expression through photography and words. Each issue is an intimate experiment.</p>
      <!-- Replace this with your real embedded flipbook link -->
      <iframe src="https://example.com/embed/your-zine"></iframe>
      <div class="purchase-links">
        <a href="#">Buy Digital</a>
        <a href="#">Buy Physical</a>
      </div>
    </div>
  </section>

  <section>
    <div class="card">
      <h2>HIRE ME</h2>
      <p>hmu, let's make something...</p>
      <form action="https://formspree.io/f/xqapyzld" method="POST">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
        <input type="submit" value="Send Message">
      </form>
    </div>
  </section>
</body>
</html>
