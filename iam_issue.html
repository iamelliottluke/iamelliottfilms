<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IAM_ISSUE – IAMELLIOTTFILMS</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div class="scroll-hint">Scroll to the next frame</div>

  <video id="background-video" autoplay muted loop playsinline poster="fallback.jpg">
    <source src="zine_teaser.mp4" type="video/mp4" />
  </video>

  <div id="grain-overlay"></div>

  <header>
    <h1><a href="index.html">IAMELLIOTTFILMS</a></h1>
    <nav class="nav-links">
      <a href="films.html">FILMS</a>
      <a href="iam_issue.html">PHOTOS</a>
    </nav>
  </header>

  <div style="height: 100vh;"></div>

  <!-- Zine Section -->
  <section class="section">
    <h2 class="title">IAM_ISSUE</h2>
    <p class="description">A photo zine series that puts regular people in the spotlight. No pro models, no big production... just real people. An evolving archive.</p>
  </section>

  <!-- Zine Carousel -->
  <div class="carousel-container">
    <div class="carousel-track">
      <div class="carousel-item"><img src="joah1.jpg" alt="Joah 1" /></div>
      <div class="carousel-item"><img src="joah2.jpg" alt="Joah 2" /></div>
      <div class="carousel-item"><img src="joah3.jpg" alt="Joah 3" /></div>
      <div class="carousel-item"><video src="joah4.mp4" autoplay muted loop playsinline></video></div>
    </div>
  </div>

  <div class="social-links" style="text-align: center;">
    <a href="https://elliottfilms.gumroad.com/l/iamissue" target="_blank">BUY DIGITAL ZINE</a>
  </div>

  <!-- Hit and Run Photos -->
  <section class="section centered-section">
    <h2 class="title">PHOTOS</h2>
    <p class="description">Hit and Run – Captured on 35mm.</p>

    <div class="carousel-container">
      <div class="carousel-track">
        <div class="carousel-item"><img src="img1.jpeg" alt="Photo 1" loading="lazy" /></div>
        <div class="carousel-item"><img src="img2.jpeg" alt="Photo 2" loading="lazy" /></div>
        <div class="carousel-item"><img src="img3.jpeg" alt="Photo 3" loading="lazy" /></div>
        <div class="carousel-item"><img src="img4.jpeg" alt="Photo 4" loading="lazy" /></div>
      </div>
    </div>
  </section>

  <script>
    window.addEventListener('scroll', function () {
      document.body.classList.toggle('scrolled', window.scrollY > 10);
    });
  </script>
</body>
</html>
