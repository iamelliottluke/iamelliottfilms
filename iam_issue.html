<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>IAM_ISSUE – IAMELLIOTTFILMS</title>
  <link rel="stylesheet" href="shared.css" />
</head>

<body>
  <!-- Scroll Hint -->
  <div class="scroll-hint">Scroll to the next frame</div>

  <!-- Background Video -->
  <video id="background-video" autoplay muted loop playsinline poster="fallback.jpg">
    <source src="zine_teaser.mp4" type="video/mp4" />
  </video>

  <!-- Grain Overlay -->
  <div id="grain-overlay"></div>

  <!-- Header -->
  <header>
    <h1><a href="index.html">IAMELLIOTTFILMS</a></h1>
    <nav class="nav-links">
      <a href="films.html">FILMS</a>
      <a href="iam_issue.html">PHOTOS</a>
    </nav>
  </header>

  <!-- Spacer (full screen hero video) -->
  <div style="height: 100vh;"></div>

  <!-- IAM ISSUE Intro -->
  <section class="section">
    <h2 class="title">IAM_ISSUE</h2>
    <p class="description">
      A photo zine series that puts regular people in the spotlight.<br>
      No pro models. No big production. Just real people.
    </p>

    <!-- Zine Stills Carousel -->
    <div class="carousel-container">
      <div class="carousel-track">

        <div class="carousel-item"><img src="joah1.jpg" alt=""></div>
        <div class="carousel-item"><img src="joah2.jpg" alt=""></div>
        <div class="carousel-item"><img src="joah3.jpg" alt=""></div>
        <div class="carousel-item"><img src="joah4.jpg" alt=""></div>
        <div class="carousel-item"><img src="joah5.jpg" alt=""></div>
        <div class="carousel-item"><img src="joah6.jpg" alt=""></div>

      </div>
    </div>

    <div class="social-links">
      <a href="https://elliottfilms.gumroad.com/l/iamissue" target="_blank">BUY DIGITAL ZINE</a>
    </div>
  </section>

  <!-- PHOTO SERIES 2 -->
  <section class="centered-section">
    <h2 class="title">PHOTOS</h2>
    <p class="description">Hit and Run — Captured on 35mm.</p>

    <div class="carousel-container">
      <div class="carousel-track">

        <div class="carousel-item"><img src="img1.jpeg" alt=""></div>
        <div class="carousel-item"><img src="img2.jpeg" alt=""></div>
        <div class="carousel-item"><img src="img3.jpeg" alt=""></div>
        <div class="carousel-item"><img src="img4.jpeg" alt=""></div>

      </div>
    </div>
  </section>

  <script>
    window.addEventListener("scroll", () => {
      document.body.classList.toggle("scrolled", window.scrollY > 10);
    });
  </script>
</body>
</html>
