<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>IAMELLIOTTFILMS</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <!-- Scroll hint -->
  <div class="scroll-hint">Scroll to the next frame</div>

  <!-- Background video -->
  <video id="background-video" autoplay muted loop playsinline preload="auto" poster="fallback.jpg">
    <source src="SITE_BACKGROUND.mp4" type="video/mp4" />
  </video>

  <!-- Grain / dark overlay -->
  <div id="grain-overlay"></div>

  <!-- Header -->
  <header>
    <h1><a href="index.html">IAMELLIOTTFILMS</a></h1>
    <nav class="nav-links">
      <a href="films.html">FILMS</a>
      <a href="iam_issue.html">PHOTOS</a>
    </nav>
  </header>

  <main>
    <!-- HERO FRAME -->
    <section class="hero">
      <h2 class="title">ELLIOTT LUKE</h2>
      <p class="description">I’m a filmmaker and photographer from Adelaide...</p>
    </section>

    <!-- CONTACT / HIRE ME FRAME -->
    <section class="hire-me">
      <div class="hire-me-card">
        <h2>CONTACT ME</h2>
        <p>Look. Mood. Story. Let’s make it happen.</p>

        <form action="https://formspree.io/f/xqapyzld" method="POST">
          <input type="text" name="name" placeholder="Your Name" required />
          <input type="email" name="email" placeholder="Your Email" required />
          <textarea name="message" rows="4" placeholder="Your Message" required></textarea>
          <button type="submit">Send</button>
        </form>

        <div class="social-links">
          <a href="https://instagram.com/iamelliottfilms">Instagram</a>
          <a href="https://youtube.com/@iamelliottfilms">YouTube</a>
          <a href="https://tiktok.com/@iamelliottfilms">TikTok</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Hide scroll hint after scrolling a little
    window.addEventListener('scroll', () => {
      document.body.classList.toggle('scrolled', window.scrollY > 10);
    });
  </script>
</body>
</html>
