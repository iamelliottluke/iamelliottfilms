  <link rel="stylesheet" href="shared_styles.css" />
  <style>
    .reel-grid {
           
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      max-width: 1000px;
      margin: 0 auto 2rem;
      padding: 2rem;

    }
    .reel-grid video {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      border: none;
      display: block;
    }
    .watch-now {
      text-align: center;
      margin-bottom: 3rem;
    }
    .watch-now a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: white;
      color: black;
      font-weight: bold;
      border-radius: 8px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
  </style>
</head>
