<!-- ============== MAGNETIC SCROLL + CAROUSEL ============== -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  /* Fade-in */
  const fadeSections = document.querySelectorAll("section, .global-social");
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("visible"); });
  }, { threshold: 0.3 });
  fadeSections.forEach(sec => observer.observe(sec));

  /* Vertical magnetic scroll */
  const snapSections = document.querySelectorAll(".section, .global-social");
  let scrolling = false;

  function magneticScroll() {
    if (scrolling) return;
    scrolling = true;

    let nearest = null;
    let nearestDist = Infinity;

    snapSections.forEach(sec => {
      const rect = sec.getBoundingClientRect();
      const dist = Math.abs(rect.top);
      if (dist < nearestDist) { nearestDist = dist; nearest = sec; }
    });

    if (nearest) nearest.scrollIntoView({ behavior:"smooth", block:"start" });

    setTimeout(() => scrolling = false, 600);
  }

  let scrollTimeout;
  window.addEventListener("scroll", () => {
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(magneticScroll, 120);
  });

  window.addEventListener("touchend", () => {
    setTimeout(magneticScroll, 120);
  });

  /* Horizontal magnetic carousel */
  const carousels = document.querySelectorAll(".carousel-container");

  carousels.forEach(container => {
    let isScrolling;

    container.addEventListener("scroll", () => {
      clearTimeout(isScrolling);

      isScrolling = setTimeout(() => {
        const items = container.querySelectorAll(".carousel-item");
        let nearest = null;
        let nearestDist = Infinity;

        items.forEach(item => {
          const box = item.getBoundingClientRect();
          const dist = Math.abs(box.left + box.width/2 - window.innerWidth/2);
          if (dist < nearestDist) { nearestDist = dist; nearest = item; }
        });

        if (nearest) nearest.scrollIntoView({ behavior:"smooth", inline:"center" });

      }, 120);
    });
  });

});
</script>
